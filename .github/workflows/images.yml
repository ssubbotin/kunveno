name: images

# Builds the four service images, checks they leak no sources, maps or debug data, and
# publishes them to GHCR (public, linked to this repository). Pull requests from branches of
# this repository also publish a preview tag pr-<number>, for trying a change on the host before
# merging; pull requests from forks build and check only (their token cannot write packages).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # The leak check must be able to fail: build a deliberately dirty image and require it to
  # report every kind of leak.
  check-the-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build a leaky image
        run: |
          docker build -t check/leaky:ci - <<'DOCKERFILE'
          FROM alpine:3.22
          RUN mkdir -p /app /usr/share/nginx/kunveno/assets /usr/local/bin \
           && echo 'package main' > /app/main.go \
           && echo '{}' > /usr/share/nginx/kunveno/assets/index.js.map \
           && echo 'x();//# sourceMappingURL=index.js.map' > /usr/share/nginx/kunveno/assets/index.js \
           && printf '/src/internal/sfu/peer.go .debug_info' > /usr/local/bin/kunveno-test
          DOCKERFILE
      - name: the check must fail and name every leak
        run: |
          if deploy/docker/check-image.sh check/leaky:ci 2> report.txt; then
            echo "check-image.sh passed a leaky image" >&2; exit 1
          fi
          cat report.txt
          for want in 'app/main.go' 'index.js.map' 'sourceMappingURL in the web bundle' 'keeps build paths' 'DWARF debug data'; do
            grep -q "$want" report.txt || { echo "not reported: $want" >&2; exit 1; }
          done

  image:
    needs: check-the-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kunveno-server
            file: deploy/docker/go.Dockerfile
            target: server
            app: kunveno-server
          - name: kunveno-echo
            file: deploy/docker/go.Dockerfile
            target: echo
            app: kunveno-echo
          - name: kunveno-player
            file: deploy/docker/go.Dockerfile
            target: player
            app: kunveno-player
          - name: kunveno-web
            file: deploy/docker/web.Dockerfile
            target: ''
            app: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version
      - id: version
        run: |
          v=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      # Build into the local daemon first and check it; only a clean image is pushed.
      # The cache lives in the repository's private Actions cache, never in the registry,
      # so build stages (which hold the sources) are not published.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          load: true
          tags: check/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: check for leaked sources and debug data
        run: deploy/docker/check-image.sh check/${{ matrix.name }}:ci
      # An install that upgrades with make up keeps its docker-compose.yml, which may predate a
      # setting the template uses: the new web image must start with the environment an older
      # compose file passes (no KUNVENO_HSTS, no GRAFANA_WALL_*).
      - name: the web image starts with an older compose file's environment
        if: matrix.name == 'kunveno-web'
        run: |
          certs=$(mktemp -d)
          cid=$(docker run -d -v "$certs:/etc/ssl/kunveno" -e SERVER_NAME=_ -e HTTP_PORT=80 -e HTTPS_PORT=443 \
            -e KUNVENO_UPSTREAM=127.0.0.1:8080 -e GRAFANA_PORT=3000 -e PUBLIC_HOST=127.0.0.1 \
            check/kunveno-web:ci)
          sleep 3
          docker exec "$cid" grep -n kunveno_hsts /etc/nginx/conf.d/kunveno.conf || true
          out=$(docker exec "$cid" wget -S -O /dev/null --no-check-certificate https://127.0.0.1/ 2>&1 || true)
          docker logs "$cid" 2>&1 | tail -5
          docker rm -f "$cid" > /dev/null
          echo "$out"
          echo "$out" | grep -q "HTTP/1.1 200" || { echo "the web image does not serve with an older compose file's environment" >&2; exit 1; }
          if echo "$out" | grep -qi "strict-transport-security"; then echo "HSTS sent without KUNVENO_HSTS" >&2; exit 1; fi
      - name: the service runs as user 10001 and names the fix for a root-owned ./data
        if: matrix.name == 'kunveno-server' || matrix.name == 'kunveno-player'
        run: deploy/docker/check-user.sh check/${{ matrix.name }}:ci
      # Known vulnerabilities with a fix available fail the build, so a release never ships them.
      - name: scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: check/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        name: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

  # The released stack starts with make up, this run's images and its hardening (no capabilities
  # beyond each service's list, no new privileges): every service stays up, the site and Grafana
  # answer, the data volume keeps a created room across make down and imports an old ./data, and
  # the server, the player and echo run as user 10001, not root.
  stack:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version
      - name: the stack starts hardened and serves
        run: |
          make deploy-bundle
          mkdir /tmp/stack && tar -xzf dist/kunveno.tgz -C /tmp/stack && cd /tmp/stack/kunveno
          sed -i -e 's/^PUBLIC_HOST=$/PUBLIC_HOST=127.0.0.1/' -e 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=x/' .env
          echo "KUNVENO_VERSION=sha-${GITHUB_SHA::7}" >> .env
          make up
          for i in $(seq 1 60); do curl -skf https://127.0.0.1/healthz > /dev/null && break; sleep 2; done
          curl -skf https://127.0.0.1/healthz
          curl -skf https://127.0.0.1/api/info > /dev/null
          for i in $(seq 1 30); do curl -skf -o /dev/null https://127.0.0.1/grafana/login && break; sleep 2; done
          curl -skf -o /dev/null https://127.0.0.1/grafana/login
          sleep 10 # a service that dies at start has restarted by now
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}'
          if docker compose ps -a --format '{{.State}} {{.Status}}' | grep -v '^running Up'; then
            docker compose logs --no-color | tail -50; exit 1
          fi
          for s in server player echo; do
            u=$(docker top "$(docker compose ps -q $s)" -o pid,uid | awk 'NR > 1 { print $2 }' | sort -u)
            echo "$s runs as uid $u"
            [ "$u" = 10001 ] || { echo "$s runs as $u, want 10001 only" >&2; exit 1; }
          done
          # A room created in the lobby lives in the data volume: it survives make down and make up.
          o=https://127.0.0.1
          curl -skf -X POST -H "Origin: $o" $o/api/rooms -d '{"name":"Persist","pin":"123456"}'
          make down
          make up
          for i in $(seq 1 60); do curl -skf $o/healthz > /dev/null && break; sleep 2; done
          curl -skf $o/api/rooms | grep -q '"slug":"persist"' || { echo "the created room did not survive make down" >&2; exit 1; }
          # A ./data of a release before 0.4.5 is imported into the volume.
          mkdir data && printf '[{"slug":"old","name":"Old","pin":"123456","max_participants":15}]' > data/rooms.json
          make import-data
          make up
          for i in $(seq 1 60); do curl -skf $o/healthz > /dev/null && break; sleep 2; done
          curl -skf $o/api/rooms | grep -q '"slug":"old"' || { echo "make import-data did not bring the old room" >&2; exit 1; }

  # A version tag also gets a GitHub release, once its images are published, carrying kunveno.tgz:
  # the stack directory with docker-compose.yml pinned to that release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the version
      - run: make deploy-bundle
      - name: the compose file follows the latest release
        run: grep -qF 'kunveno-server:${KUNVENO_VERSION:-latest}' dist/kunveno/docker-compose.yml
      - env:
          GH_TOKEN: ${{ github.token }}
        # A re-run (for example after re-pushing a tag) refreshes the archive of an existing release.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/kunveno.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/kunveno.tgz
          fi
