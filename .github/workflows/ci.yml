name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh deploy/docker/web-cert.sh deploy/docker/check-image.sh
      # The released archive must run with nothing but the two values filled in.
      - name: the stack archive is complete
        run: |
          make deploy-bundle
          mkdir /tmp/stack && tar -xzf dist/kunveno.tgz -C /tmp/stack && cd /tmp/stack/kunveno
          test -f docker-compose.yml && test -f config.yaml && test -d data && test -d certs && test -d media && test -d grafana/provisioning
          sed -i -e 's/^PUBLIC_HOST=$/PUBLIC_HOST=10.0.0.5/' -e 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=x/' .env
          docker compose config --quiet
          docker compose config --images | grep -qx 'ghcr.io/ssubbotin/kunveno-server:latest'
          echo KUNVENO_VERSION=9.9.9 >> .env
          docker compose config --images | grep -qx 'ghcr.io/ssubbotin/kunveno-server:9.9.9'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1 -race
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/kunveno-server
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
