<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How kunveno fits together</title>
  <!-- Drawn by the diagram-design rules (github.com/cathrynlavery/diagram-design), system fonts:
       the exported SVG in docs/images makes no network request. Export:
         python3 export_svg.py docs/diagrams/architecture.html docs/images/architecture.svg --system-fonts -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · kunveno</p>
    <h1>How kunveno fits together</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How kunveno fits together</title>
        <desc id="architecture-desc">Browsers on the LAN or VPN reach nginx over HTTPS and send media straight to the kunveno server on one port; the echo and player helpers, Prometheus and Grafana talk to the server over loopback on the same host, and the player pulls an RTSP camera.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="76" y="80" width="224" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="88" y="84" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="120" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LAN / VPN</text>

        <rect x="348" y="80" width="536" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="360" y="84" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="416" y="93" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">HOST · DOCKER COMPOSE</text>

        <!-- Arrows (before nodes) -->
        <!-- 1. Browsers → nginx: HTTPS and WebSocket on 443 -->
        <line x1="276" y1="148" x2="388" y2="148" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="300" y="128" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="137" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS :443</text>

        <!-- 2. Browsers → server: media, the headline path -->
        <path d="M188,176 V268 Q188,276 196,276 H388" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="256" y="256" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="265" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WEBRTC :7000</text>

        <!-- 3. nginx → server: /ws and /api over loopback -->
        <line x1="476" y1="176" x2="476" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="484" y="204" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="510" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/WS /API</text>

        <!-- 4. nginx → Grafana: /grafana/ -->
        <line x1="564" y1="148" x2="668" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="584" y="128" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="137" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/GRAFANA/</text>

        <!-- 5. Grafana → Prometheus -->
        <line x1="756" y1="176" x2="756" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="764" y="204" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="786" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PROMQL</text>

        <!-- 6. Prometheus → server: scrapes /metrics -->
        <line x1="668" y1="276" x2="564" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="588" y="256" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="614" y="265" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/METRICS</text>

        <!-- 7. Helpers → server: they join rooms over loopback -->
        <path d="M668,388 H508 Q500,388 500,380 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="556" y="368" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="590" y="377" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOOPBACK WS</text>

        <!-- 8. Camera → helpers: the player pulls the feed -->
        <line x1="276" y1="420" x2="668" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="456" y="400" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RTSP</text>

        <!-- Nodes -->
        <!-- Browsers (input) -->
        <rect x="100" y="120" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="120" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="108" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="124" y="135" fill="rgba(90,101,128,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USERS</text>
        <text x="188" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browsers</text>
        <text x="188" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chrome · firefox</text>

        <!-- RTSP camera (external) -->
        <rect x="100" y="376" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="100" y="376" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="108" y="382" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="120" y="391" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CAM</text>
        <text x="188" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">RTSP camera</text>
        <text x="188" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rtsp:// over tcp</text>

        <!-- nginx (backend) -->
        <rect x="388" y="120" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="388" y="120" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="396" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="412" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
        <text x="476" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">nginx</text>
        <text x="476" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">:443 tls · static client</text>

        <!-- kunveno-server (focal) -->
        <rect x="388" y="248" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="388" y="248" width="176" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="396" y="254" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="408" y="263" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SFU</text>
        <text x="476" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">kunveno-server</text>
        <text x="476" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ws signaling · sfu :7000</text>

        <!-- Grafana (backend) -->
        <rect x="668" y="120" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="668" y="120" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="676" y="126" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="686" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="756" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Grafana</text>
        <text x="756" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/grafana/ dashboard</text>

        <!-- Prometheus (store) -->
        <rect x="668" y="248" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="668" y="248" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="676" y="254" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="690" y="263" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TSDB</text>
        <text x="756" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prometheus</text>
        <text x="756" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">127.0.0.1:9095</text>

        <!-- Echo and player (optional helpers) -->
        <rect x="668" y="376" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="668" y="376" width="176" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="676" y="382" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="688" y="391" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
        <text x="756" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Echo and player</text>
        <text x="756" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">echo · player · ffmpeg</text>

        <!-- Legend -->
        <line x1="76" y1="504" x2="884" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="76" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="160" y1="520" x2="184" y2="520" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="192" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">MEDIA · WEBRTC</text>
        <line x1="320" y1="520" x2="344" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="352" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">HTTPS · WEBSOCKET</text>
        <line x1="496" y1="520" x2="520" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="528" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">ON THE HOST</text>
        <rect x="648" y="514" width="20" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="676" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">THE MEDIA SERVER</text>
        <rect x="800" y="514" width="20" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="828" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">OPTIONAL</text>
      </svg>
    </div>
  </div>
</body>
</html>
