# Security headers of the site, included in the HTTPS server block (/etc/nginx/kunveno-headers.conf):
# the common ones, then the page policy and the opener policy, which only the client gets (Grafana
# under /grafana/ brings its own page policy; ours would block its scripts).
#
# The page policy allows what the client uses and nothing else: its own scripts, WebAssembly (noise
# filter, background segmentation), the segmentation worker, blob: images and media (an own
# background), WebSocket and API requests to this host ('self' covers wss: on the same host and
# port); no plugins, no <base>, no framing by other sites.
include /etc/nginx/kunveno-headers-common.conf;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Cross-Origin-Opener-Policy same-origin always;
