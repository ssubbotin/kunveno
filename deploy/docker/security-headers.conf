# Security headers of the site, included in the HTTPS server block (/etc/nginx/kunveno-headers.conf).
# Locations without an add_header of their own inherit them; /grafana/ sets its own, since this page
# policy would block Grafana's scripts.
#
# The page policy allows what the client uses and nothing else: its own scripts, WebAssembly (noise
# filter, background segmentation), the segmentation worker, blob: images and media (an own
# background), the WebSocket of this host; no plugins, no <base>, no framing by other sites.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss://$http_host; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Empty unless KUNVENO_HSTS is set (an empty value sends no header).
add_header Strict-Transport-Security $kunveno_hsts always;
