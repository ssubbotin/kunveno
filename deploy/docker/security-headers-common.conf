# Security headers every response gets, the site's and Grafana's (/etc/nginx/kunveno-headers-common.conf).
# An add_header in a location replaces everything it would inherit, so the site's headers file and the
# /grafana/ location both include this one.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;
# Empty unless KUNVENO_HSTS is set (an empty value sends no header). It assumes HTTPS on port 443:
# browsers that have seen it upgrade http://host/ to https://host:443/.
add_header Strict-Transport-Security $kunveno_hsts always;
