# kunveno stack: signaling + SFU server and nginx with the web client. Images are built by CI
# (.github/workflows/images.yml) and published to GHCR; KUNVENO_VERSION in .env picks the release.
# Both services use host networking: the SFU advertises the host's VPN address and one UDP port,
# and nginx reaches the server on loopback. Settings come from .env (see .env.example).
# Logs go to the host's systemd journal, so they outlive container recreation on every deploy:
#   journalctl -t kunveno-server --since "7 days ago"
# Retention follows the host journal (persistent in /var/log/journal), not Docker's json-file limits.
x-logging: &journald
  driver: journald

services:
  server:
    logging:
      <<: *journald
      options:
        tag: kunveno-server
    image: ghcr.io/ssubbotin/kunveno-server:${KUNVENO_VERSION:?set KUNVENO_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/kunveno/config.yaml:ro
      # Rooms created in the lobby (rooms.json). Must be writable by uid 10001.
      - ./data:/var/lib/kunveno

  web:
    logging:
      <<: *journald
      options:
        tag: kunveno-web
    image: ghcr.io/ssubbotin/kunveno-web:${KUNVENO_VERSION:?set KUNVENO_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      KUNVENO_UPSTREAM: ${KUNVENO_UPSTREAM:-127.0.0.1:8080}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    volumes:
      - ./certs:/etc/ssl/kunveno:ro

  # Sound-check helper. Idle until someone presses "Эхо-тест" in a room; then it joins that room
  # and plays its audio back after ECHO_DELAY. Talks to the server over loopback only.
  echo:
    logging:
      <<: *journald
      options:
        tag: kunveno-echo
    image: ghcr.io/ssubbotin/kunveno-echo:${KUNVENO_VERSION:?set KUNVENO_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      ECHO_URL: ws://${KUNVENO_UPSTREAM:-127.0.0.1:8080}/ws
      ECHO_CONTROL_URL: http://${KUNVENO_UPSTREAM:-127.0.0.1:8080}/internal/echo
      ECHO_DELAY: ${ECHO_DELAY:-2s}

  # Looped video for rooms with "player:" in config.yaml. Files come from ./media (read-only);
  # the transcoded copies are cached in ./data/player-cache.
  player:
    logging:
      <<: *journald
      options:
        tag: kunveno-player
    image: ghcr.io/ssubbotin/kunveno-player:${KUNVENO_VERSION:?set KUNVENO_VERSION in .env}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      PLAYER_URL: ws://${KUNVENO_UPSTREAM:-127.0.0.1:8080}/ws
    volumes:
      - ./config.yaml:/etc/kunveno/config.yaml:ro
      - ./media:/media:ro
      - ./data:/var/lib/kunveno

  # Metrics: scrapes the server's /metrics on loopback. Listens on loopback only.
  prometheus:
    logging:
      <<: *journald
      options:
        tag: kunveno-prometheus
    image: prom/prometheus:v3.5.0
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s/__KUNVENO_TARGET__/${KUNVENO_UPSTREAM:-127.0.0.1:8080}/" /etc/prometheus/prometheus.yml.template > /prometheus/prometheus.yml &&
        exec /bin/prometheus --config.file=/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d} --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9095}
    volumes:
      - ./prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - prometheus-data:/prometheus

  # Dashboards at https://<host>/grafana/ (nginx proxies the subpath). Loopback only.
  grafana:
    logging:
      <<: *journald
      options:
        tag: kunveno-grafana
    image: grafana/grafana:12.1.1
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kunveno.json
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9095}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
