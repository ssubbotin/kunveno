# kunveno stack: signaling + SFU server and nginx with the web client.
# Both services use host networking: the SFU advertises the host's VPN address and one UDP port,
# and nginx reaches the server on loopback. Settings come from .env (see .env.example).
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: kunveno-server:${KUNVENO_VERSION:-local}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/kunveno/config.yaml:ro
      # Rooms created in the lobby (rooms.json). Must be writable by uid 10001.
      - ./data:/var/lib/kunveno

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: kunveno-web:${KUNVENO_VERSION:-local}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      KUNVENO_UPSTREAM: ${KUNVENO_UPSTREAM:-127.0.0.1:8080}
    volumes:
      - ./certs:/etc/ssl/kunveno:ro

  # Sound check: joins ECHO_ROOM as "Echo" and plays the room's audio back after ECHO_DELAY.
  # Optional. Enable: docker compose --profile echo up -d echo. Disable: docker compose stop echo.
  echo:
    profiles: [echo]
    build:
      context: .
      dockerfile: Dockerfile.echo
    image: kunveno-echo:${KUNVENO_VERSION:-local}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      ECHO_URL: ws://${KUNVENO_UPSTREAM:-127.0.0.1:8080}/ws
      ECHO_ROOM: ${ECHO_ROOM:-}
      ECHO_PIN: ${ECHO_PIN:-}
      ECHO_NAME: ${ECHO_NAME:-Echo (2 s delay)}
      ECHO_DELAY: ${ECHO_DELAY:-2s}
