# Install as /etc/nginx/sites-available/kunveno.conf and symlink into sites-enabled. The package also
# installs the security headers (/etc/nginx/kunveno-headers.conf, kunveno-headers-common.conf).

# Strict-Transport-Security: empty sends none. On a server with a public certificate and HTTPS on
# port 443, set it to "max-age=31536000".
map $host $kunveno_hsts {
    default "";
}

server {
    listen 80;
    server_tokens off;
    server_name meet.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name meet.example.internal;

    ssl_certificate     /etc/ssl/kunveno/fullchain.pem;
    ssl_certificate_key /etc/ssl/kunveno/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    include /etc/nginx/kunveno-headers.conf;

    root /var/www/kunveno;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Recording downloads are hundreds of megabytes: stream them, no temp file, no timeout cut.
    location ~ "^/api/rooms/[a-z0-9-]+/recording/[0-9a-f]{32}$" {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Sign-in (auth.enabled): the provider's redirects and the session, proxied like /api/.
    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
}
