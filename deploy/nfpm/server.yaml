name: kunveno-server
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Sergey Subbotin <ssubbotin@gmail.com>
description: kunveno meeting server (WebSocket signaling and WebRTC SFU)
contents:
  - src: bin/kunveno-server
    dst: /usr/local/bin/kunveno-server
    file_info:
      mode: 0755
  - src: deploy/systemd/kunveno-server.service
    dst: /lib/systemd/system/kunveno-server.service
    file_info:
      mode: 0644
  - src: deploy/config.example.yaml
    dst: /etc/kunveno/config.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: kunveno
scripts:
  preinstall: deploy/nfpm/preinstall.sh
  postinstall: deploy/nfpm/postinstall.sh
