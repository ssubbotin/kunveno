name: kunveno-web
arch: all
platform: linux
version: ${VERSION}
section: web
priority: optional
maintainer: Sergey Subbotin <ssubbotin@gmail.com>
license: AGPL-3.0-only
description: kunveno web client (static files for nginx)
depends:
  - nginx
contents:
  - src: web/dist/
    dst: /var/www/kunveno/
  - src: deploy/nginx/kunveno.conf
    dst: /etc/nginx/sites-available/kunveno.conf
    type: config|noreplace
  - src: deploy/docker/security-headers.conf
    dst: /etc/nginx/kunveno-headers.conf
  - src: deploy/docker/security-headers-common.conf
    dst: /etc/nginx/kunveno-headers-common.conf
