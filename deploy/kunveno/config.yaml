# kunveno-server configuration: config.yaml next to docker-compose.yml (or /etc/kunveno/config.yaml
# for the Debian package). Works as is; adjust the rooms, PINs and title. After a change:
#   docker compose restart server player
http:
  # listen: 127.0.0.1:8080      # nginx proxies /ws and /api/ here; default KUNVENO_UPSTREAM from .env
  # allowed_origins: ["https://meet.example.internal"]   # default: same host as the request
media:
  udp_port: 7000                # one UDP port for all media; open it on the VPN interface only
  tcp_port: 7000                # ICE-TCP fallback for clients whose UDP path fails; -1 disables
  # advertise_ip: 10.8.0.1      # the address browsers send media to; default KUNVENO_ADVERTISE_IP
                                # from .env, else the host's primary IPv4 address
  share_max_kbps: 2500
  # reconnect_grace: 15        # seconds a dropped media connection may stay down before the client rejoins (3..120)
ui:
  title: kunveno                # shown in the lobby and the browser tab, e.g. your company's name
  # reactions: ["👍", "👎", "👏", "😂", "❤️", "🎉", "😮", "🤔", "☕", "👋"]   # 1..16 emoji; default shown
  # noise_suppression: false     # true: the noise filter starts on for participants who have not chosen
# rooms_file: /var/lib/kunveno/rooms.json   # rooms created in the lobby; default shown
# backgrounds_dir: /var/lib/kunveno/backgrounds   # virtual background presets; the stack mounts ./backgrounds here
# Meeting notes need the commercial kunveno-notes add-on (licensing: ssubbotin@gmail.com). Install
# it first, then switch them on here and run: docker compose restart server
# notes:
#   enabled: false            # true offers "Take notes" in rooms; false hides every notes control
#   keep: 1d                  # how long notes stay after they end: 90m, 12h, 1d, 2d
#   live: false               # debug: show phrases in the room as they are recognised
#   summary: false            # true: a summary of each meeting's notes, written by an LLM (the add-on's summary overlay)
#   dir: /var/lib/kunveno/notes
# The list of each room's meetings: a meeting with nothing left (notes, summary, recording)
# stays listed this long after it ends. notes.keep and recording.keep set how long each item stays.
#meetings:
#  keep: 30d
# Meeting recording: the screen and everyone's audio as one video per meeting. Needs the
# kunveno-recorder add-on (its compose overlay); set enabled: true together with installing it,
# then: docker compose restart server
#recording:
#  enabled: true
#  keep: 1d            # how long the last meeting's recording stays: 90m, 12h, 1d, 2d
#  dir: /var/lib/kunveno/recordings
#  max_size: 8GB       # largest file the bot may hand over
# Voice stand-up facilitator. The switch appears only in the listed rooms. Needs the private
# kunveno-facilitator add-on running; set enabled: true together with installing it,
# then: docker compose restart server
#facilitator:
#  enabled: true
#  rooms: [ops]
# Sign-in (optional). Off: anyone who reaches the server sees the lobby, as before. On: people sign
# in with a provider; room PINs are still asked; guests join one room by an invitation link.
# auth:
#   enabled: true
#   public_url: https://meet.example.com      # the address people open
#   session: 12h
#   invite_max: 168h
#   providers:
#     - type: yandex                           # Yandex ID; the secret goes in .env
#       name: "Yandex 360"
#       client_id: "..."
#       allow: ["*@example.com"]               # accounts of the Yandex 360 organization

rooms:
  - slug: ops
    name: Operations
    pin: "1234"
    max_participants: 15
  - slug: dev
    name: Development
    pin: "5678"
  # A room with a looped video: the player service plays media/<file> there, always on.
  # - slug: tv
  #   name: Video
  #   pin: "123456"
  #   player:
  #     file: intro.mp4       # any format ffmpeg reads; transcoded once to VP8/Opus 640x360
  #     name: Intro           # tile label; defaults to the file name
  # A room with a live camera: the player encodes the RTSP feed as it arrives, always on.
  # - slug: yard
  #   name: Yard camera
  #   pin: "123456"
  #   player:
  #     url: rtsp://user:password@10.10.10.50:554/stream1   # rtsp:// or rtsps://; over TCP
  #     name: Yard            # defaults to the camera's host
  - slug: all-hands
    name: All hands
    pin: "9999"
    max_participants: 30
